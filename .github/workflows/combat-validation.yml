name: Combat validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "work/**"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit combat data
        run: pnpm audit:card-vfx && pnpm audit:combat-data && pnpm audit:card-combat && pnpm audit:chain-data && pnpm audit:encounters && pnpm audit:board-data && pnpm audit:attack-data && pnpm audit:folder-data
      - name: Run unit tests
        run: pnpm test
      - name: Type check
        run: pnpm check
      - name: Build
        run: pnpm build

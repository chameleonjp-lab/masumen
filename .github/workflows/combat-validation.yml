name: Combat validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, "work/**"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit combat data
        run: pnpm audit:card-vfx && pnpm audit:combat-data && pnpm audit:card-combat && pnpm audit:chain-data && pnpm audit:encounters && pnpm audit:board-data && pnpm audit:attack-data && pnpm audit:folder-data && pnpm audit:browser-contract
      - name: Run unit tests
        run: pnpm test
      - name: Type check
        run: pnpm check
      - name: Build
        run: pnpm build
      - name: Audit build output
        run: pnpm audit:build-output
      - name: Install pinned browser test dependency
        run: npm install --prefix "$RUNNER_TEMP/masumen-browser" --no-save --package-lock=false --ignore-scripts playwright@1.62.1
      - name: Browser checks with all ranking RPCs mocked
        env:
          PLAYWRIGHT_PACKAGE: ${{ runner.temp }}/masumen-browser/node_modules/playwright
        run: |
          pnpm dev --port 4175 > "$RUNNER_TEMP/masumen-vite.log" 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID" 2>/dev/null || true' EXIT
          node -e 'let n=0;const check=()=>fetch("http://localhost:4175/").then(r=>{if(!r.ok)throw Error(r.status)}).catch(e=>{if(++n>=60){console.error(e);process.exit(1)}setTimeout(check,1000)});check()'
          node scripts/check-localization-browser.cjs
          node scripts/check-result-flow-browser.cjs
